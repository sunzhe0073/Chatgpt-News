<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>私人 AI 新闻简报</title><style>body{font:16px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f3f0e8;color:#202420}.wrap{max-width:760px;margin:12vh auto;padding:24px}.card{background:#fffefa;border:1px solid #d9d5ca;border-radius:8px;padding:22px}a{color:#315f78}</style><script>(function(){var f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'});var parts=f.formatToParts(new Date()),o={};parts.forEach(function(p){o[p.type]=p.value});var d=o.year+'-'+o.month+'-'+o.day;var target='私人AI新闻简报-'+d+'.html?v='+Date.now();fetch(target,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('not ready');return r.text()}).then(function(html){document.open();document.write(html);document.close()}).catch(function(){document.addEventListener('DOMContentLoaded',function(){document.getElementById('status').innerHTML='今天（'+d+'）的新闻简报尚未成功发布。请稍后重新打开此固定网址。';});});})();</script></head><body><div class="wrap"><div class="card"><h1>私人 AI 新闻简报</h1><p id="status">正在加载今天的新闻简报……</p></div></div></body></html>
