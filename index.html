<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>私人 AI 新闻简报</title>
<style>body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f3f0e8;color:#202420}.msg{max-width:760px;margin:15vh auto;padding:24px}.muted{color:#687168;font-size:14px}</style>
<script>
(async()=>{
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t).value;
  const today=`${get('year')}-${get('month')}-${get('day')}`;
  const file=`私人AI新闻简报-${today}.html`;
  const url=encodeURI(file)+`?v=${today}-${Date.now()}`;
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const html=await r.text();
    document.open(); document.write(html); document.close();
  }catch(e){
    document.addEventListener('DOMContentLoaded',()=>{
      document.body.innerHTML=`<div class="msg"><h2>今天的新闻简报尚未成功发布</h2><p>目标日期：${today}</p><p>页面不会继续显示昨天的旧简报，以免误导。</p><p class="muted">请稍后刷新；系统发布完成后，这个固定网址会自动显示当天版本。</p></div>`;
    });
  }
})();
</script>
</head>
<body><div class="msg"><p>正在载入今天的新闻简报…</p></div></body>
</html>
