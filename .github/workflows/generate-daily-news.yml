name: Generate daily news brief

on:
  schedule:
    # GitHub cron uses UTC. 01:05 UTC is 09:05 in Singapore (UTC+8).
    - cron: "5 1 * * *"
    # Simple recovery run at 10:05 Singapore time. If the first run already
    # published the same brief, the commit step exits without a new commit.
    - cron: "5 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-news-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Decide whether recovery run is needed
        id: gate
        shell: bash
        run: |
          day="$(TZ=Asia/Singapore date +%F)"
          if [[ "${{ github.event.schedule }}" == "5 2 * * *" && -f "私人AI新闻简报-${day}.html" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's brief already exists; recovery run is not needed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.run == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/256977843894/locations/global/workloadIdentityPools/chatgpt-news-github/providers/github-actions
          service_account: chatgpt-news-translation@project-d7893afe-ec91-47bb-86d.iam.gserviceaccount.com
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install translation runtime
        if: steps.gate.outputs.run == 'true'
        run: python3 -m pip install --requirement requirements-translation.txt
      - name: Generate today's brief from English sources
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: project-d7893afe-ec91-47bb-86d
        run: python3 scripts/generate_news.py
      - name: Validate generated brief
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          day="$(TZ=Asia/Singapore date +%F)"
          python3 scripts/validate_news.py "私人AI新闻简报-${day}.html" --date "$day"
      - name: Commit and push a new brief
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          day="$(TZ=Asia/Singapore date +%F)"
          file="私人AI新闻简报-${day}.html"
          git add -- "$file"
          if git diff --cached --quiet; then
            echo "Today's brief is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily news brief ${day}"
          git push origin HEAD:main
